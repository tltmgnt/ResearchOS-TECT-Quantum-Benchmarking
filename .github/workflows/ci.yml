name: Verify quantum benchmarking workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: researchos-qbi validate examples/bell-synthetic.json
      - run: researchos-qbi run examples/bell-synthetic.json --output runs/bell
      - run: researchos-qbi verify runs/bell
      - run: researchos-qbi report runs/bell
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark-python-${{ matrix.python }}
          path: runs/bell/
